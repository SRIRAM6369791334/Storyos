version: '3.8'

services:
  # 1. Primary Relational Store with RLS Support
  postgres:
    image: postgres:16-alpine
    container_name: storyos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: storyos_dev
      POSTGRES_USER: storyos_admin
      POSTGRES_PASSWORD: storyos_dev_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U storyos_admin -d storyos_dev']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Knowledge Graph Engine (ADR-0007 / Task 1.5)
  neo4j:
    image: neo4j:5.18-community
    container_name: storyos-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/storyos_dev_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
    ports:
      - '7474:7474' # HTTP Console
      - '7687:7687' # Bolt Protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Redis Working Memory & Cache (Task 4.2 / Task 1.6)
  redis:
    image: redis:7.2-alpine
    container_name: storyos-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel notice
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Milvus Etcd Dependency
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: storyos-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 10s
      timeout: 5s
      retries: 5

  # 5. Milvus MinIO Dependency
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: storyos-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Milvus Vector Search Engine (Task 4.2 / Task 1.6)
  milvus:
    image: milvusdb/milvus:v2.3.15
    container_name: storyos-milvus
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - '19530:19530'
      - '9091:9091'
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 10s
      timeout: 5s
      retries: 5

  # 7. Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: storyos-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 8. Apache Kafka Integration Event Bus (Task 2.2 / Task 5.4)
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: storyos-kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
